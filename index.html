<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#1f2937">

  <title>Mostads Transport</title>

  <style>
    :root {
      --blue: #1255d9;
      --blue-dark: #0b3f9f;
      --green: #16a34a;
      --green-dark: #0f7d37;
      --bg: #eef3f8;
      --card: #ffffff;
      --line: #dbe3ee;
      --text: #152238;
      --muted: #6d7b90;
      --danger: #c62828;
      --soft: #f7f9fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        linear-gradient(
          180deg,
          #eef3f8,
          #f7f9fc
        );
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        linear-gradient(
          135deg,
          #1f2937,
          #374151
        );
    }

    .login-card {
      width: min(430px, 100%);
      padding: 28px;
      border-radius: 24px;
      background: #fff;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.25);
    }

    .login-brand {
      margin-bottom: 4px;
      font-size: 29px;
      font-weight: 950;
    }

    .login-brand span {
      color: var(--blue);
    }

    .login-sub {
      margin-bottom: 22px;
      color: var(--muted);
    }

    .login-input {
      width: 100%;
      margin-bottom: 12px;
      padding: 15px 16px;
      border: 2px solid var(--line);
      border-radius: 15px;
      background: #fff;
      font-size: 18px;
      outline: none;
    }

    .login-input:focus {
      border-color: var(--blue);
      box-shadow:
        0 0 0 4px
        rgba(18, 85, 217, 0.08);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 15px;
      background: var(--green);
      color: #fff;
      font-size: 19px;
      font-weight: 950;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      font-weight: 850;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0f0;
      border: 2px solid #f0b8b8;
      color: var(--danger);
    }

    .message.ok {
      background: #eafff0;
      border: 2px solid #a9e8bc;
      color: #117536;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 18px 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -0.8px;
    }

    .brand span {
      color: var(--blue);
    }

    .userbox {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .userpill {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      font-weight: 850;
    }

    .logout {
      padding: 9px 12px;
      border: 0;
      border-radius: 11px;
      background: #eaf0f8;
      color: var(--blue-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow:
        0 10px 28px
        rgba(40, 67, 110, 0.07);
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 21px;
      font-weight: 950;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .info-box {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--soft);
    }

    .info-box span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .info-box strong {
      font-size: 20px;
    }

    .role-badge {
      display: inline-flex;
      margin-top: 14px;
      padding: 8px 11px;
      border-radius: 999px;
      background: #e8f4ff;
      color: #0c5fa8;
      font-size: 13px;
      font-weight: 950;
    }

    @media (max-width: 720px) {
      .app {
        padding: 11px 11px 34px;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand {
        font-size: 24px;
      }

      .userbox {
        max-width: 60%;
      }

      .welcome-grid {
        grid-template-columns: 1fr;
      }

      /* ===== KÖRNINGSFORMULÄR ===== */

.transport-input,
.transport-textarea {
  width: 100%;
  padding: 15px 16px;
  border: 2px solid var(--line);
  border-radius: 15px;
  background: #fff;
  color: var(--text);
  font-size: 18px;
  outline: none;
}

.transport-input:focus,
.transport-textarea:focus {
  border-color: var(--blue);
  box-shadow:
    0 0 0 4px
    rgba(18, 85, 217, 0.08);
}

.transport-textarea {
  resize: vertical;
}

.order-number-input {
  margin-top: 10px;
  font-size: 21px;
  font-weight: 850;
}

.report-card {
  padding: 0;
  overflow: hidden;
}

.report-toggle {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 20px;
  cursor: pointer;
}

.report-toggle > input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.report-toggle-box {
  display: grid;
  flex: 0 0 27px;
  width: 27px;
  height: 27px;
  place-items: center;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.report-toggle input:checked +
.report-toggle-box {
  border-color: var(--blue);
  background: var(--blue);
}

.report-toggle input:checked +
.report-toggle-box::after {
  content: "✓";
  color: #fff;
  font-size: 18px;
  font-weight: 950;
}

.report-toggle strong {
  display: block;
  font-size: 20px;
  font-weight: 950;
}

.report-toggle small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.35;
}

.report-fields {
  display: grid;
  grid-template-columns:
    minmax(130px, 0.35fr)
    minmax(0, 1fr);
  gap: 14px;
  padding: 18px 20px 20px;
  border-top: 1px solid var(--line);
  background: var(--soft);
}

.report-fields label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  color: var(--text);
  font-size: 13px;
  font-weight: 900;
}

.waiting-input-wrap {
  position: relative;
}

.waiting-input-wrap .transport-input {
  padding-right: 58px;
}

.waiting-input-wrap span {
  position: absolute;
  top: 50%;
  right: 16px;
  color: var(--muted);
  font-weight: 900;
  transform: translateY(-50%);
}

.send-transport-btn {
  width: 100%;
  margin-top: 4px;
  padding: 20px;
  border: 0;
  border-radius: 18px;
  background: var(--green);
  color: #fff;
  font-size: 23px;
  font-weight: 950;
  cursor: pointer;
  box-shadow:
    0 10px 22px
    rgba(22, 163, 74, 0.22);
}

.send-transport-btn:active {
  transform: translateY(1px);
  background: var(--green-dark);
}

.send-transport-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

@media (max-width: 720px) {
  .report-toggle {
    padding: 17px;
  }

  .report-toggle strong {
    font-size: 19px;
  }

  .report-fields {
    grid-template-columns: 1fr;
    padding: 16px;
  }

  .order-number-input {
    font-size: 19px;
  }
}

/* ===== SLUT KÖRNINGSFORMULÄR ===== */

/* ===== ADMINRAPPORTER ===== */

.admin-report-list {
  display: grid;
  gap: 14px;
}

.admin-report-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #fff;
  box-shadow:
    0 8px 22px
    rgba(40, 67, 110, 0.06);
}

.admin-report-top {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: flex-start;
}

.admin-report-order {
  font-size: 20px;
  font-weight: 950;
}

.admin-report-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.admin-report-time {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.admin-report-events {
  display: grid;
  gap: 10px;
  margin-top: 15px;
}

.admin-event {
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--soft);
}

.admin-event strong {
  display: block;
  margin-bottom: 4px;
  font-size: 15px;
}

.admin-event p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.4;
}

.admin-empty {
  padding: 26px;
  text-align: center;
  color: var(--muted);
}

@media (max-width: 600px) {
  .admin-report-top {
    flex-direction: column;
  }

  .admin-report-time {
    white-space: normal;
  }
}

/* ===== SLUT ADMINRAPPORTER ===== */

<body>

  <div
    id="loginScreen"
    class="login-screen"
  >
    <form
      id="loginForm"
      class="login-card"
    >
      <div class="login-brand">
        MOSTADS <span>TRANSPORT</span>
      </div>

      <div class="login-sub">
        Logga in med din tilldelade användare.
      </div>

      <input
        id="loginEmail"
        class="login-input"
        type="email"
        autocomplete="username"
        placeholder="E-post"
        required
      >

      <input
        id="loginPassword"
        class="login-input"
        type="password"
        autocomplete="current-password"
        placeholder="Lösenord"
        required
      >

      <button
        id="loginBtn"
        class="login-btn"
        type="submit"
      >
        LOGGA IN
      </button>

      <div
        id="loginMessage"
        class="message error"
      ></div>
    </form>
  </div>


  <div
    id="mainApp"
    class="app hidden"
  >
    <div class="topbar">

      <div class="brand">
        MOSTADS <span>TRANSPORT</span>
      </div>

      <div class="userbox">
        <span
          id="userPill"
          class="userpill"
        ></span>

        <button
          id="logoutBtn"
          class="logout"
          type="button"
        >
          Logga ut
        </button>
      </div>

    </div>


    <div class="card">

      <div class="section-title">
        Välkommen
      </div>

    <div class="welcome-grid">

  <div class="info-box">
    <span id="profileNameLabel">Chaufför</span>
    <strong id="profileName">–</strong>
  </div>

  <div class="info-box">
    <span id="profileVehicleLabel">Fordon</span>
    <strong id="profileVehicle">–</strong>
  </div>

  <div
    id="profileLocationBox"
    class="info-box hidden"
  >
    <span>Plats</span>
    <strong id="profileLocation">–</strong>
  </div>

</div>
      <div
        id="profileRole"
        class="role-badge"
      >
        –
      </div>

    </div>

    <div
  id="driverPlaceholder"
  class="hidden"
>

  <form id="transportForm">

    <!-- ORDERNUMMER -->
    <div class="card">
      <div class="section-title">
        Ny körning
      </div>

      <p class="muted">
        Ange ordernumret för den körning du rapporterar.
      </p>

      <input
        id="orderNumber"
        class="transport-input order-number-input"
        type="text"
        inputmode="numeric"
        placeholder="Ordernummer, t.ex. 204569"
        autocomplete="off"
        required
      >
    </div>


    <!-- BYTESPALL -->
    <div class="card report-card">
      <label class="report-toggle">
        <input
          id="usePallet"
          type="checkbox"
        >

        <span class="report-toggle-box"></span>

        <span>
          <strong>Bytespall</strong>
          <small>
            Rapportera pall som inte lämnats ut eller annan pallavvikelse.
          </small>
        </span>
      </label>

      <div
        id="palletFields"
        class="report-fields hidden"
      >
        <label>
          Antal
          <input
            id="palletQuantity"
            class="transport-input"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            placeholder="T.ex. 13"
          >
        </label>

        <label>
          Kommentar
          <textarea
            id="palletComment"
            class="transport-textarea"
            rows="3"
            placeholder="T.ex. De lämnar inte ut bytespall"
          ></textarea>
        </label>
      </div>
    </div>


    <!-- BOM -->
    <div class="card report-card">
      <label class="report-toggle">
        <input
          id="useBom"
          type="checkbox"
        >

        <span class="report-toggle-box"></span>

        <span>
          <strong>Bom</strong>
          <small>
            Rapportera bomkörning.
          </small>
        </span>
      </label>

      <div
        id="bomFields"
        class="report-fields hidden"
      >
        <label>
          Antal
          <input
            id="bomQuantity"
            class="transport-input"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            value="1"
          >
        </label>

        <label>
          Kommentar

            id="bomComment"
            class="transport-textarea"
            rows="3"

        </label>

    <!-- VÄNTETID -->

      <label class="report-toggle">

          id="useWaiting"
          type="checkbox"
        >

        <span>

            Rapportera väntetid på aktuell order.
          </small>

              id="waitingHours"

    <!-- SKICKA -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="./config.js"></script>

  <script>
    (() => {
      'use strict';

      const cfg =
        window.MOSTADS_CONFIG || {};

      const $ = id =>
        document.getElementById(id);

      if (
        !cfg.supabaseUrl ||
        !cfg.supabasePublishableKey
      ) {
        $('loginMessage').textContent =
          'Supabase-inställningar saknas i config.js.';
        $('loginMessage').classList.add('show');
        return;
      }

      const db =
        window.supabase.createClient(
          cfg.supabaseUrl,
          cfg.supabasePublishableKey
        );

      let currentUser = null;
      let currentProfile = null;

      function showLoginMessage(message) {
        const box = $('loginMessage');

        box.textContent = message;
        box.classList.add('show');
      }

      function clearLoginMessage() {
        const box = $('loginMessage');

        box.textContent = '';
        box.classList.remove('show');
      }

      function roleLabel(role) {
        return role === 'admin'
          ? 'Admin'
          : 'Chaufför';
      }

      async function loadProfile(user) {
        const { data, error } = await db
          .from('profiles')
         .select(
  'id,display_name,vehicle_number,location,role,active'
)
          .eq('id', user.id)
          .single();

        if (error) {
          throw error;
        }

        if (!data.active) {
          throw new Error(
            'Din användare är inaktiverad.'
          );
        }

        return data;
      }

      function showApp() {
        $('loginScreen')
          .classList.add('hidden');

        $('mainApp')
          .classList.remove('hidden');

        $('userPill').textContent =
          currentProfile.display_name;

        $('profileName').textContent =
  currentProfile.display_name;

$('profileVehicle').textContent =
  currentProfile.vehicle_number || '–';

$('profileRole').textContent =
  roleLabel(currentProfile.role);

if (currentProfile.role === 'admin') {
  $('profileNameLabel').textContent =
    'Inloggad som';

  $('profileVehicleLabel').textContent =
    'ID / Enhet';

  if (currentProfile.location) {
    $('profileLocation').textContent =
      currentProfile.location;

    $('profileLocationBox')
      .classList.remove('hidden');
  } else {
    $('profileLocationBox')
      .classList.add('hidden');
  }
} else {
  $('profileNameLabel').textContent =
    'Chaufför';

  $('profileVehicleLabel').textContent =
    'Fordon';

  $('profileLocationBox')
    .classList.add('hidden');
}
        if (currentProfile.role === 'admin') {
          $('adminPlaceholder')
            .classList.remove('hidden');

          $('driverPlaceholder')
            .classList.remove('hidden');
          
          loadAdminReports();
          
        } else {
          $('driverPlaceholder')
            .classList.remove('hidden');

          $('adminPlaceholder')
            .classList.add('hidden');
        }
      }

      /* ===== ADMINRAPPORTER ===== */

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatReportDate(value) {
  if (!value) return '';

  return new Intl.DateTimeFormat('sv-SE', {
    dateStyle: 'medium',
    timeStyle: 'short'
  }).format(new Date(value));
}

async function loadAdminReports() {
  if (currentProfile?.role !== 'admin') {
    return;
  }

  const container = $('adminReports');

  container.innerHTML = `
    <div class="card">
      <p class="muted">
        Laddar rapporter...
      </p>
    </div>
  `;

  try {
    const { data, error } = await db
      .from('reports')
      .select(`
        id,
        order_number,
        has_pallet,
        pallet_quantity,
        pallet_comment,
        has_bom,
        bom_quantity,
        bom_comment,
        has_waiting,
        waiting_minutes,
        waiting_comment,
        has_damage,
        damage_comment,
        driver_name_snapshot,
        vehicle_number_snapshot,
        created_at,
        status
      `)
      .order('created_at', {
        ascending: false
      })
      .limit(100);

    if (error) {
      throw error;
    }

    const reports = data || [];

    if (!reports.length) {
      container.innerHTML = `
        <div class="card">
          <div class="admin-empty">
            Inga rapporter har skickats ännu.
          </div>
        </div>
      `;
      return;
    }

    container.innerHTML = reports.map(report => {
      const events = [];

      if (report.has_pallet) {
        events.push(`
          <div class="admin-event">
            <strong>Bytespall</strong>
            <div>
              Antal:
              ${Number(report.pallet_quantity || 0)}
            </div>
            ${
              report.pallet_comment
                ? `<p>${escapeHtml(report.pallet_comment)}</p>`
                : ''
            }
          </div>
        `);
      }

      if (report.has_bom) {
        events.push(`
          <div class="admin-event">
            <strong>Bom</strong>
            <div>
              Antal:
              ${Number(report.bom_quantity || 0)}
            </div>
            ${
              report.bom_comment
                ? `<p>${escapeHtml(report.bom_comment)}</p>`
                : ''
            }
          </div>
        `);
      }

      if (report.has_waiting) {
        const minutes =
          Number(report.waiting_minutes || 0);

        const hours = minutes / 60;

        events.push(`
          <div class="admin-event">
            <strong>Väntetid</strong>
            <div>
              ${hours.toLocaleString('sv-SE')} tim
            </div>
            ${
              report.waiting_comment
                ? `<p>${escapeHtml(report.waiting_comment)}</p>`
                : ''
            }
          </div>
        `);
      }

      if (report.has_damage) {
        events.push(`
          <div class="admin-event">
            <strong>Skada / defekt</strong>
            ${
              report.damage_comment
                ? `<p>${escapeHtml(report.damage_comment)}</p>`
                : '<p>Ingen kommentar angiven.</p>'
            }
          </div>
        `);
      }

      return `
        <div class="admin-report-card">

          <div class="admin-report-top">
            <div>
              <div class="admin-report-order">
                Order #${escapeHtml(report.order_number)}
              </div>

              <div class="admin-report-meta">
                ${escapeHtml(
                  report.vehicle_number_snapshot || '–'
                )}
                ·
                ${escapeHtml(
                  report.driver_name_snapshot || '–'
                )}
              </div>
            </div>

            <div class="admin-report-time">
              ${formatReportDate(report.created_at)}
            </div>
          </div>

          <div class="admin-report-events">
            ${events.join('')}
          </div>

        </div>
      `;
    }).join('');

  } catch (error) {
    console.error(
      'Kunde inte ladda adminrapporter:',
      error
    );

    container.innerHTML = `
      <div class="card">
        <div class="message error show">
          Rapporterna kunde inte laddas.
        </div>
      </div>
    `;
  }
}

/* ===== ONESIGNAL USER ===== */

async function connectOneSignalUser(user) {
  if (!user?.id) {
    return;
  }

  try {
    window.OneSignalDeferred =
      window.OneSignalDeferred || [];

    window.OneSignalDeferred.push(
      async function(OneSignal) {

        await OneSignal.login(user.id);

        if (currentProfile) {
          await OneSignal.User.addTags({
            role: currentProfile.role || '',
            name: currentProfile.display_name || '',
            vehicle:
              currentProfile.vehicle_number || ''
          });
        }

        console.log(
          'OneSignal kopplad till användare:',
          user.id
        );
      }
    );

  } catch (error) {
    console.error(
      'OneSignal kunde inte kopplas:',
      error
    );
  }
}

/* ===== SLUT ONESIGNAL USER ===== */
      
async function startSession(user) {
  currentUser = user;

  currentProfile =
    await loadProfile(user);

  await connectOneSignalUser(user);

  showApp();
}

      $('loginForm')
        .addEventListener(
          'submit',
          async event => {
            event.preventDefault();

            clearLoginMessage();

            const button =
              $('loginBtn');

            button.disabled = true;
            button.textContent =
              'LOGGAR IN...';

            try {
              const email =
                $('loginEmail')
                  .value
                  .trim();

              const password =
                $('loginPassword')
                  .value;

              const {
                data,
                error
              } =
                await db.auth
                  .signInWithPassword({
                    email,
                    password
                  });

              if (error) {
                throw error;
              }

              await startSession(
                data.user
              );

            } catch (error) {
              console.error(
                'Inloggning misslyckades:',
                error
              );

              showLoginMessage(
                error?.message ||
                'Kunde inte logga in.'
              );
            } finally {
              button.disabled = false;
              button.textContent =
                'LOGGA IN';
            }
          }
        );

      /* ===== RAPPORTFÄLT ===== */

      const reportSections = [
        {
          checkbox: 'usePallet',
          fields: 'palletFields'
        },
        {
          checkbox: 'useBom',
          fields: 'bomFields'
        },
        {
          checkbox: 'useWaiting',
          fields: 'waitingFields'
        },
        {
          checkbox: 'useDamage',
          fields: 'damageFields'
        }
      ];

      reportSections.forEach(section => {
        const checkbox = $(section.checkbox);
        const fields = $(section.fields);

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            fields.classList.remove('hidden');
          } else {
            fields.classList.add('hidden');
          }
        });
      });

/* ===== SKICKA KÖRNINGSRAPPORT ===== */

$('transportForm').addEventListener('submit', async event => {
  event.preventDefault();

  const button = $('sendTransportBtn');
  const messageBox = $('transportMessage');

  messageBox.classList.remove('show', 'ok', 'error');
  messageBox.textContent = '';

  const orderNumber = $('orderNumber').value.trim();

  const hasPallet = $('usePallet').checked;
  const hasBom = $('useBom').checked;
  const hasWaiting = $('useWaiting').checked;
  const hasDamage = $('useDamage').checked;

  if (!orderNumber) {
    messageBox.textContent = 'Ange ordernummer.';
    messageBox.classList.add('show', 'error');
    return;
  }

  if (!hasPallet && !hasBom && !hasWaiting && !hasDamage) {
    messageBox.textContent = 'Välj minst en rapporttyp.';
    messageBox.classList.add('show', 'error');
    return;
  }

  const waitingHours = Number(
    $('waitingHours').value || 0
  );

  const waitingMinutes =
    hasWaiting
      ? Math.round(waitingHours * 60)
      : null;

  button.disabled = true;
  button.textContent = 'SKICKAR...';

  try {
    const payload = {
      p_order_number: orderNumber,

      p_has_pallet: hasPallet,
      p_pallet_quantity: hasPallet
        ? Number($('palletQuantity').value || 0)
        : null,
      p_pallet_comment: hasPallet
        ? $('palletComment').value.trim() || null
        : null,

      p_has_bom: hasBom,
      p_bom_quantity: hasBom
        ? Number($('bomQuantity').value || 0)
        : null,
      p_bom_comment: hasBom
        ? $('bomComment').value.trim() || null
        : null,

      p_has_waiting: hasWaiting,
      p_waiting_minutes: waitingMinutes,
      p_waiting_comment: hasWaiting
        ? $('waitingComment').value.trim() || null
        : null,

      p_has_damage: hasDamage,
      p_damage_comment: hasDamage
        ? $('damageComment').value.trim() || null
        : null
    };

    const { data: reportId, error } = await db.rpc(
      'create_run_report',
      payload
    );

    if (error) {
      throw error;
    }

    messageBox.textContent =
      `Rapport #${reportId} har skickats.`;

    messageBox.classList.add('show', 'ok');

    /* Töm formuläret inför nästa körning */
    $('transportForm').reset();

    reportSections.forEach(section => {
      $(section.fields).classList.add('hidden');
    });

    /* Bom ska återgå till antal 1 */
    $('bomQuantity').value = '1';

    /* Lägg fokus på nästa ordernummer */
    $('orderNumber').focus();

  } catch (error) {
    console.error(
      'Rapporten kunde inte skickas:',
      error
    );

    messageBox.textContent =
      error?.message ||
      'Rapporten kunde inte skickas.';

    messageBox.classList.add('show', 'error');

  } finally {
    button.disabled = false;
    button.textContent = 'SKICKA RAPPORT';
  }
});

      async function restoreSession() {
        try {
          const {
            data: {
              session
            }
          } =
            await db.auth.getSession();

          if (!session?.user) {
            return;
          }

          await startSession(
            session.user
          );

        } catch (error) {
          console.error(
            'Kunde inte återställa session:',
            error
          );

          await db.auth.signOut();
        }
      }

      restoreSession();

    })();
